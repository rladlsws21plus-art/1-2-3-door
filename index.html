<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>술자리 3문(門) 다수결 탈출 서바이벌</title>
  
  <!-- 카카오톡 인앱 브라우저 자동 탈출 스크립트 -->
  <script>
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const targetUrl = window.location.href;
      if (/KAKAOTALK/i.test(ua)) {
        if (/iPhone|iPad|iPod/i.test(ua)) {
          window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
        } else {
          window.location.href = 'intent://' + targetUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=http;package=com.android.chrome;end';
        }
      }
    })();
  </script>

  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    #app-container {
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      background: #14161f;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 20px 16px;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 1.7rem;
      color: #ffd700;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .subtitle {
      font-size: 0.85rem;
      color: #8c92a4;
      text-align: center;
      margin-top: 4px;
    }

    .card-box {
      width: 100%;
      background: #1e2230;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2d3246;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #3b425b;
      background: #10121a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ffd700;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.05s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary { background: #ffd700; color: #111; }
    .btn-secondary { background: #2c3246; color: #fff; }
    .btn-danger { background: #ff4757; color: #fff; }
    .btn-success { background: #2ed573; color: #111; }

    /* 대기실 목록 */
    .player-list-box {
      width: 100%;
      flex: 1;
      min-height: 140px;
      background: #181b26;
      border-radius: 12px;
      padding: 12px;
      overflow-y: auto;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #262b3d;
    }

    .player-row {
      background: #232838;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
    }
    .player-row.me {
      border: 1px solid #ffd700;
      color: #ffd700;
      font-weight: bold;
    }
    .host-tag {
      background: #ffd700;
      color: #111;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 선택 UI */
    .status-badge {
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffd700;
      background: #1e2230;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 6px;
      border: 1px solid #3b425b;
    }

    .door-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }

    .door-button {
      width: 100%;
      height: 74px;
      background: linear-gradient(145deg, #242a3c, #191c28);
      border: 2px solid #363e58;
      border-radius: 14px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .door-button.selected {
      border-color: #ffd700;
      background: #393217;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.45);
    }
    .door-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .penalty-preview-box {
      width: 100%;
      background: #231c26;
      border: 1px dashed #ff4757;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ff7675;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 5초 대기 화면 */
    .reveal-big-num {
      font-size: 5rem;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }

    /* 결과 카드 */
    .result-row-card {
      width: 100%;
      background: #1f2333;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid #4b5366;
    }
    .result-row-card.escaped {
      border-left-color: #2ed573;
      background: #192a20;
    }
    .result-row-card.danger {
      border-left-color: #ff4757;
      background: #2e1b23;
    }
  </style>
</head>
<body>

<div id="app-container">

  <!-- 1. 메인 화면 -->
  <div id="screen-main" class="screen active">
    <div>
      <h1>🚪 3문(門) 눈치게임</h1>
      <p class="subtitle">다수파는 탈출! 최후의 1인이 벌칙 독박!</p>
    </div>

    <div class="card-box">
      <input type="text" id="input-nickname" placeholder="닉네임 입력 (최대 6자)" maxlength="6">
      <button class="btn btn-primary" id="btn-create-room">👑 새 방 만들기</button>
      
      <div style="display:flex; gap:8px; margin-top:4px;">
        <input type="text" id="input-room-code" placeholder="방 코드 4자리" maxlength="4" style="flex:1;">
        <button class="btn btn-secondary" id="btn-join-room" style="flex:1;">🚪 입장</button>
      </div>
    </div>

    <p style="font-size:0.8rem; color:#686f84; text-align:center;">최소 3명 ~ 최대 15명 동시 지원</p>
  </div>

  <!-- 2. 대기실 화면 -->
  <div id="screen-lobby" class="screen">
    <div>
      <p class="subtitle">초대 코드</p>
      <h1 id="lobby-room-code" style="font-size: 2.5rem; letter-spacing: 5px;">----</h1>
    </div>

    <div class="player-list-box">
      <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#8c92a4; margin-bottom:4px;">
        <span>참가자 현황</span>
        <span id="lobby-player-count">0 / 15명</span>
      </div>
      <div id="lobby-players-list"></div>
    </div>

    <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
      <div id="lobby-guide-msg" style="text-align:center; font-size:0.85rem; color:#a2a8ba;"></div>
      <button class="btn btn-primary" id="btn-start-game" disabled>🚀 게임 시작 (방장 전용)</button>
      <button class="btn btn-secondary" id="btn-leave-room">방 나가기</button>
    </div>
  </div>

  <!-- 3. 선택 단계 (PLAYING) -->
  <div id="screen-game" class="screen">
    <div style="text-align:center; width:100%;">
      <div class="status-badge" id="game-round-badge">1라운드</div>
      <p class="subtitle" id="game-status-text">모두가 선택할 때까지 기다립니다.</p>
      <p id="game-choice-progress" style="font-size:0.85rem; color:#ffd700; margin-top:2px;">선택 완료: 0 / 0명</p>
    </div>

    <!-- 3문 모드 -->
    <div class="door-grid" id="door-selection-container">
      <button class="door-button choice-btn" id="door-1" data-num="1">🚪 1번 문</button>
      <button class="door-button choice-btn" id="door-2" data-num="2">🚪 2번 문</button>
      <button class="door-button choice-btn" id="door-3" data-num="3">🚪 3번 문</button>
    </div>

    <!-- 1대1 가위바위보 모드 -->
    <div class="door-grid" id="rps-selection-container" style="display:none;">
      <button class="door-button choice-btn" id="rps-1" data-num="1">✊ 바위</button>
      <button class="door-button choice-btn" id="rps-2" data-num="2">✌️ 가위</button>
      <button class="door-button choice-btn" id="rps-3" data-num="3">🖐️ 보</button>
    </div>

    <div class="penalty-preview-box" id="my-penalty-display">
      선택하면 내 벌칙이 즉시 공개됩니다.
    </div>
  </div>

  <!-- 4. 5초 대기 화면 (REVEAL) -->
  <div id="screen-reveal" class="screen" style="justify-content:center; gap:16px;">
    <p class="subtitle" style="font-size:1.15rem; color:#ffd700; font-weight:bold;">모두가 선택을 마쳤습니다!</p>
    <p class="subtitle" style="font-size:0.95rem; color:#fff;">결과가 곧 발표됩니다.</p>
    <div class="reveal-big-num" id="reveal-timer-num">5</div>
    <div class="penalty-preview-box" id="reveal-my-penalty-box" style="width:90%;">
      내 벌칙 확인 중...
    </div>
  </div>

  <!-- 5. 최종 결과 화면 (RESULT) -->
  <div id="screen-result" class="screen">
    <div style="text-align:center;">
      <h1 id="result-main-title">💥 라운드 결과</h1>
      <p class="subtitle" id="result-summary-text">결과를 확인하세요!</p>
    </div>

    <div style="width:100%; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin:10px 0;" id="result-cards-container"></div>

    <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-primary" id="btn-next-round" style="display:none;">🔄 다음 라운드 진행 (방장)</button>
      <button class="btn btn-success" id="btn-restart-game" style="display:none;">🎉 새 게임 시작 (로비로)</button>
      <p id="result-wait-msg" style="text-align:center; font-size:0.85rem; color:#aaa; display:none;">방장이 다음 진행을 준비하고 있습니다...</p>
    </div>
  </div>

</div>

<script>
  // Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyCl58pNX7c9h3XSPoIuVkYmA-gGQwVv0fo",
    authDomain: "door-games.firebaseapp.com",
    databaseURL: "https://door-games-default-rtdb.firebaseio.com",
    projectId: "door-games",
    storageBucket: "door-games.firebasestorage.app",
    messagingSenderId: "31418414822",
    appId: "1:31418414822:web:727be266afd8fb894f6d27"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  const myId = 'user_' + Math.random().toString(36).substr(2, 9);
  let myNickname = '';
  let currentRoomCode = '';
  let isHost = false;
  let myChoice = 0;
  let roomListener = null;
  let hostTimerInterval = null;

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function generatePenalties() {
    const list = [1, 2, 3, 4, 5];
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return {
      door1: `🍺 소주 ${list[0]}잔`,
      door2: `🍻 소주 ${list[1]}잔`,
      door3: `💥 소주 ${list[2]}잔!`
    };
  }

  function createRoom() {
    const name = document.getElementById('input-nickname').value.trim();
    if (!name) return alert('닉네임을 입력해 주세요!');
    myNickname = name;
    isHost = true;

    currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    const roomRef = db.ref('rooms/' + currentRoomCode);

    roomRef.set({
      hostId: myId,
      status: 'WAITING',
      round: 1,
      doorPenalties: generatePenalties(),
      revealTimer: 5,
      players: {
        [myId]: { name: myNickname, choice: 0, inDanger: true, isHost: true }
      }
    }).then(() => {
      listenRoom(currentRoomCode);
      showScreen('screen-lobby');
    });
  }

  function joinRoom() {
    const name = document.getElementById('input-nickname').value.trim();
    const code = document.getElementById('input-room-code').value.trim();
    if (!name) return alert('닉네임을 입력해 주세요!');
    if (!code || code.length !== 4) return alert('4자리 방 코드를 입력해 주세요!');
    myNickname = name;

    const roomRef = db.ref('rooms/' + code);
    roomRef.once('value', snap => {
      const room = snap.val();
      if (!room) return alert('존재하지 않는 방입니다.');
      if (room.status !== 'WAITING') return alert('이미 게임이 진행 중입니다.');

      const players = room.players || {};
      if (Object.keys(players).length >= 15) return alert('방 인원이 가득 찼습니다 (최대 15명).');

      isHost = (room.hostId === myId);
      currentRoomCode = code;

      roomRef.child('players/' + myId).set({
        name: myNickname,
        choice: 0,
        inDanger: true,
        isHost: isHost
      }).then(() => {
        listenRoom(currentRoomCode);
        showScreen('screen-lobby');
      });
    });
  }

  function listenRoom(code) {
    if (roomListener) roomListener.off();
    const roomRef = db.ref('rooms/' + code);
    roomListener = roomRef;

    roomRef.on('value', snap => {
      const room = snap.val();
      if (!room) return;

      const players = room.players || {};
      const playerList = Object.keys(players).map(k => ({ id: k, ...players[k] }));
      const playerCount = playerList.length;
      const dangerPlayers = playerList.filter(p => p.inDanger);
      const amIInDanger = players[myId] ? players[myId].inDanger : false;

      // 1. 대기실 (WAITING)
      if (room.status === 'WAITING') {
        if (hostTimerInterval) clearInterval(hostTimerInterval);
        document.getElementById('lobby-room-code').innerText = code;
        document.getElementById('lobby-player-count').innerText = `${playerCount} / 15명`;

        const listEl = document.getElementById('lobby-players-list');
        listEl.innerHTML = '';
        playerList.forEach(p => {
          const div = document.createElement('div');
          div.className = 'player-row' + (p.id === myId ? ' me' : '');
          div.innerHTML = `
            <span>${p.name} ${p.id === myId ? '(나)' : ''}</span>
            ${p.isHost ? '<span class="host-tag">방장</span>' : ''}
          `;
          listEl.appendChild(div);
        });

        const startBtn = document.getElementById('btn-start-game');
        const guideMsg = document.getElementById('lobby-guide-msg');
        if (isHost) {
          startBtn.style.display = 'block';
          if (playerCount >= 3) {
            startBtn.disabled = false;
            guideMsg.innerText = '인원이 모였습니다! 시작 버튼을 누르세요.';
          } else {
            startBtn.disabled = true;
            guideMsg.innerText = `최소 3명 이상 모여야 합니다 (현재 ${playerCount}명)`;
          }
        } else {
          startBtn.style.display = 'none';
          guideMsg.innerText = '방장이 게임을 시작하기를 기다리는 중...';
        }

        resetClientChoiceUI();
        showScreen('screen-lobby');
      }

      // 2. 선택 단계 (PLAYING)
      if (room.status === 'PLAYING') {
        if (hostTimerInterval) clearInterval(hostTimerInterval);
        showScreen('screen-game');
        
        // 새 라운드/재경기 진입 시 내 선택값이 서버에 0이면 로컬 UI도 리셋
        if (players[myId] && players[myId].choice === 0 && myChoice !== 0) {
          resetClientChoiceUI();
        }

        const isRpsMode = (dangerPlayers.length === 2);
        document.getElementById('game-round-badge').innerText = isRpsMode ? '⚔️ 1:1 결승전 (가위바위보)' : `${room.round || 1}라운드 (잔류 ${dangerPlayers.length}명)`;
        
        document.getElementById('door-selection-container').style.display = isRpsMode ? 'none' : 'flex';
        document.getElementById('rps-selection-container').style.display = isRpsMode ? 'flex' : 'none';

        const chosenCount = dangerPlayers.filter(p => p.choice > 0).length;
        document.getElementById('game-choice-progress').innerText = `선택 완료: ${chosenCount} / ${dangerPlayers.length}명`;

        if (!amIInDanger) {
          document.getElementById('game-status-text').innerText = '🥳 탈출 성공! 안전하게 관전 중입니다.';
          document.getElementById('my-penalty-display').innerText = '생존 클리어 (탈출 완료)';
          disableAllChoices();
        } else {
          document.getElementById('game-status-text').innerText = isRpsMode ? '가위, 바위, 보를 골라 승리하고 탈출하세요!' : '다수가 선택한 문은 탈출! 대세를 따르세요.';
        }

        // 전원 선택 완료 시 방장이 REVEAL 상태로 전환
        if (isHost) {
          const allChosen = dangerPlayers.length > 0 && dangerPlayers.every(p => p.choice > 0);
          if (allChosen && !room.revealTriggered) {
            roomRef.update({ 
              status: 'REVEAL', 
              revealTriggered: true, 
              revealTimer: 5,
              revealProcessed: false 
            });
          }
        }
      }

      // 3. 5초 대기 화면 (REVEAL - 모든 플레이어 화면 동기화)
      if (room.status === 'REVEAL') {
        showScreen('screen-reveal');

        // DB에 기록된 실시간 카운트다운 숫자를 모든 참가자 화면에 표시
        document.getElementById('reveal-timer-num').innerText = room.revealTimer !== undefined ? room.revealTimer : 5;

        const penalties = room.doorPenalties || {};
        const isRpsMode = (dangerPlayers.length === 2);

        if (!amIInDanger) {
          document.getElementById('reveal-my-penalty-box').innerText = '탈출자 (안전)';
        } else if (myChoice > 0) {
          if (isRpsMode) {
            const rpsNames = { 1: '✊ 바위', 2: '✌️ 가위', 3: '🖐️ 보' };
            document.getElementById('reveal-my-penalty-box').innerText = `내 선택: ${rpsNames[myChoice]}`;
          } else {
            document.getElementById('reveal-my-penalty-box').innerText = `내 방: ${myChoice}번 문 (${penalties['door' + myChoice] || ''})`;
          }
        } else {
          document.getElementById('reveal-my-penalty-box').innerText = '미선택';
        }

        // 방장이 1초마다 DB의 revealTimer를 차감하여 전원 브로드캐스팅
        if (isHost && !room.revealProcessed) {
          roomRef.update({ revealProcessed: true });
          if (hostTimerInterval) clearInterval(hostTimerInterval);

          let currentSec = 5;
          hostTimerInterval = setInterval(() => {
            currentSec--;
            if (currentSec > 0) {
              roomRef.update({ revealTimer: currentSec });
            } else {
              clearInterval(hostTimerInterval);
              roomRef.update({ status: 'RESULT', revealTimer: 0 });
            }
          }, 1000);
        }
      }

      // 4. 결과 화면 (RESULT)
      if (room.status === 'RESULT') {
        if (hostTimerInterval) clearInterval(hostTimerInterval);
        showScreen('screen-result');
        renderResult(room, playerList, dangerPlayers);
      }
    });
  }

  function disableAllChoices() {
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  }

  function resetClientChoiceUI() {
    myChoice = 0;
    document.querySelectorAll('.choice-btn').forEach(b => {
      b.classList.remove('selected');
      b.disabled = false;
    });
    document.getElementById('my-penalty-display').innerText = '선택하면 내 벌칙이 즉시 공개됩니다.';
  }

  function makeChoice(num) {
    if (myChoice > 0) return;
    myChoice = num;

    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    const target = document.querySelector(`[data-num="${num}"]:not([style*="display: none"])`);
    if (target) target.classList.add('selected');

    db.ref(`rooms/${currentRoomCode}/players/${myId}/choice`).set(num);

    db.ref(`rooms/${currentRoomCode}`).once('value', snap => {
      const room = snap.val() || {};
      const dangerCount = Object.values(room.players || {}).filter(p => p.inDanger).length;
      if (dangerCount === 2) {
        const rpsNames = { 1: '✊ 바위', 2: '✌️ 가위', 3: '🖐️ 보' };
        document.getElementById('my-penalty-display').innerText = `내 선택: ${rpsNames[num]} (상대방 선택 대기 중)`;
      } else {
        const pen = (room.doorPenalties || {})['door' + num] || '';
        document.getElementById('my-penalty-display').innerText = `내 방: ${num}번 문 ➔ ${pen}! (대기 중)`;
      }
    });
  }

  function renderResult(room, playerList, dangerPlayers) {
    const isRpsMode = (dangerPlayers.length === 2);
    const container = document.getElementById('result-cards-container');
    container.innerHTML = '';

    const nextBtn = document.getElementById('btn-next-round');
    const restartBtn = document.getElementById('btn-restart-game');
    const waitMsg = document.getElementById('result-wait-msg');
    const summaryText = document.getElementById('result-summary-text');
    const mainTitle = document.getElementById('result-main-title');

    // 1대1 가위바위보 판정
    if (isRpsMode) {
      const p1 = dangerPlayers[0];
      const p2 = dangerPlayers[1];
      const rpsNames = { 1: '✊ 바위', 2: '✌️ 가위', 3: '🖐️ 보' };

      let winnerId = null;
      let isDraw = false;

      if (p1.choice === p2.choice) {
        isDraw = true;
      } else if (
        (p1.choice === 1 && p2.choice === 2) ||
        (p1.choice === 2 && p2.choice === 3) ||
        (p1.choice === 3 && p2.choice === 1)
      ) {
        winnerId = p1.id;
      } else {
        winnerId = p2.id;
      }

      if (isDraw) {
        mainTitle.innerText = '🤝 무승부 (재경기)!';
        summaryText.innerText = '두 사람의 수가 같습니다. 다시 선택합니다!';
      } else {
        const winner = dangerPlayers.find(p => p.id === winnerId);
        const loser = dangerPlayers.find(p => p.id !== winnerId);
        mainTitle.innerText = '💥 최종 벌칙자 확정!';
        summaryText.innerText = `[${winner.name}] 탈출 성공! ➔ [${loser.name}] 최종 벌칙 수행!`;
      }

      [p1, p2].forEach(p => {
        const isWin = (p.id === winnerId);
        const div = document.createElement('div');
        div.className = `result-row-card ${isWin ? 'escaped' : 'danger'}`;
        div.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:1.05rem; color:${isWin ? '#2ed573' : '#ff4757'};">
              ${p.name} (${rpsNames[p.choice] || '미선택'}) ${isWin ? '🥳 생존 탈출' : (isDraw ? '재경기' : '💥 최종 벌칙 당첨!')}
            </div>
          </div>
        `;
        container.appendChild(div);
      });

      if (isHost) {
        if (isDraw) {
          nextBtn.style.display = 'block';
          nextBtn.innerText = '🔄 가위바위보 재경기 시작';
          restartBtn.style.display = 'none';
        } else {
          nextBtn.style.display = 'none';
          restartBtn.style.display = 'block';
        }
      }
      return;
    }

    // 3문 다수결 판정
    const counts = { 1: 0, 2: 0, 3: 0 };
    const members = { 1: [], 2: [], 3: [] };

    dangerPlayers.forEach(p => {
      if (p.choice >= 1 && p.choice <= 3) {
        counts[p.choice]++;
        members[p.choice].push(p);
      }
    });

    const chosenCounts = [1, 2, 3].map(d => counts[d]).filter(c => c > 0);
    const maxCount = chosenCounts.length > 0 ? Math.max(...chosenCounts) : 0;
    const penalties = room.doorPenalties || {};

    let escapingPlayersThisRound = [];

    for (let i = 1; i <= 3; i++) {
      const isEscape = (counts[i] === maxCount && maxCount > 0);
      if (isEscape) {
        escapingPlayersThisRound.push(...members[i]);
      }

      const div = document.createElement('div');
      div.className = `result-row-card ${isEscape ? 'escaped' : 'danger'}`;
      div.innerHTML = `
        <div>
          <div style="font-weight:bold; font-size:1.02rem; color:${isEscape ? '#2ed573' : '#ff4757'};">
            🚪 ${i}번 문 (${counts[i]}명) ${isEscape ? '🥳 다수 생존 탈출!' : '⚠️ 잔류 (패배 위기)'}
          </div>
          <div style="font-size:0.85rem; color:#aaa; margin-top:3px;">
            ${members[i].map(m => m.name).join(', ') || '선택자 없음'}
          </div>
        </div>
        <div style="font-weight:bold; font-size:0.95rem; color:#ffd700; text-align:right;">
          ${penalties['door' + i] || ''}
        </div>
      `;
      container.appendChild(div);
    }

    const allTied = (chosenCounts.length > 1 && chosenCounts.every(c => c === chosenCounts[0]));
    if (allTied) {
      mainTitle.innerText = '🤝 동점 발생 (재경기)!';
      summaryText.innerText = '동점입니다! 아무도 탈출하지 못해 다시 선택합니다.';
    } else {
      mainTitle.innerText = '💥 라운드 결과';
      summaryText.innerText = `다수 문을 선택한 ${escapingPlayersThisRound.length}명이 안전하게 탈출했습니다!`;
    }

    if (isHost) {
      nextBtn.style.display = 'block';
      nextBtn.innerText = allTied ? '🔄 재경기 시작 (방장)' : '🔄 다음 라운드 진행 (방장)';
      restartBtn.style.display = 'none';
      waitMsg.style.display = 'none';
    } else {
      nextBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      waitMsg.style.display = 'block';
    }
  }

  function nextRound() {
    if (!isHost) return;
    const roomRef = db.ref('rooms/' + currentRoomCode);

    roomRef.once('value', snap => {
      const room = snap.val() || {};
      const players = room.players || {};
      const dangerPlayers = Object.keys(players).map(k => ({ id: k, ...players[k] })).filter(p => p.inDanger);

      const isRpsMode = (dangerPlayers.length === 2);
      const counts = { 1: 0, 2: 0, 3: 0 };
      dangerPlayers.forEach(p => {
        if (p.choice >= 1 && p.choice <= 3) counts[p.choice]++;
      });
      const chosenCounts = [1, 2, 3].map(d => counts[d]).filter(c => c > 0);
      const maxCount = chosenCounts.length > 0 ? Math.max(...chosenCounts) : 0;
      const allTied = (chosenCounts.length > 1 && chosenCounts.every(c => c === chosenCounts[0]));

      const updates = {};
      Object.keys(players).forEach(pid => {
        const p = players[pid];
        updates[`players/${pid}/choice`] = 0; // 전원 선택값 리셋
        if (!isRpsMode && p.inDanger && !allTied) {
          const isEscape = (counts[p.choice] === maxCount && maxCount > 0);
          updates[`players/${pid}/inDanger`] = !isEscape;
        }
      });

      updates['status'] = 'PLAYING';
      updates['round'] = allTied ? (room.round || 1) : ((room.round || 1) + 1);
      updates['doorPenalties'] = generatePenalties();
      updates['revealTriggered'] = false;
      updates['revealProcessed'] = false;
      updates['revealTimer'] = 5;

      roomRef.update(updates).then(() => {
        resetClientChoiceUI();
      });
    });
  }

  function restartGameToLobby() {
    if (!isHost) return;
    const roomRef = db.ref('rooms/' + currentRoomCode);
    roomRef.once('value', snap => {
      const room = snap.val() || {};
      const players = room.players || {};
      const updates = {};
      Object.keys(players).forEach(pid => {
        updates[`players/${pid}/choice`] = 0;
        updates[`players/${pid}/inDanger`] = true;
      });
      updates['status'] = 'WAITING';
      updates['round'] = 1;
      updates['revealTriggered'] = false;
      updates['revealProcessed'] = false;
      updates['revealTimer'] = 5;
      roomRef.update(updates);
    });
  }

  // 터치 이벤트 바인딩 (pointerdown)
  document.getElementById('btn-create-room').addEventListener('pointerdown', createRoom);
  document.getElementById('btn-join-room').addEventListener('pointerdown', joinRoom);
  document.getElementById('btn-start-game').addEventListener('pointerdown', () => { if (isHost) nextRound(); });
  document.getElementById('btn-next-round').addEventListener('pointerdown', nextRound);
  document.getElementById('btn-restart-game').addEventListener('pointerdown', restartGameToLobby);

  [1, 2, 3].forEach(num => {
    document.getElementById('door-' + num).addEventListener('pointerdown', () => makeChoice(num));
    document.getElementById('rps-' + num).addEventListener('pointerdown', () => makeChoice(num));
  });

  document.getElementById('btn-leave-room').addEventListener('pointerdown', () => {
    if (currentRoomCode) {
      db.ref(`rooms/${currentRoomCode}/players/${myId}`).remove();
    }
    location.reload();
  });
</script>

</body>
</html>
